name: Descomprimir proyecto
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir
        run: |
          unzip -o Flow-Apps-con-README.zip
          rm Flow-Apps-con-README.zip
      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Descomprimir proyecto"
          git push
